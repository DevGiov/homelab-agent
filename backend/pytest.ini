[pytest]
testpaths = tests
pythonpath = .
markers =
    live: richiede infrastruttura reale (es. la microVM Firecracker); esclusi di default, eseguire con `-m live`. Le valutazioni dei modelli sono in app/evals (make eval)
# Default: solo test ermetici. Nessun test deve poter bloccare la suite: oltre il limite fallisce
addopts = -p no:cacheprovider -m "not live"
timeout = 60
