[pytest]
testpaths = tests
pythonpath = .
markers =
    live: richiede servizi reali (LLM, MetaMCP, Letta, SearXNG); esclusi di default, eseguire con `-m live`
# Default: solo test ermetici. Nessun test deve poter bloccare la suite: oltre il limite fallisce
addopts = -p no:cacheprovider -m "not live"
timeout = 60
