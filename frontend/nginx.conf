server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow image uploads and multi-image vision payloads up to 50MB
    client_max_body_size 50M;

    gzip on;
    gzip_types application/javascript text/css;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sempre rivalidato: dopo un deploy punta subito ai chunk nuovi
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Generato dall'entrypoint con la API key: mai in cache
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Chunk con hash nel nome: immutabili. Un chunk assente è un 404, non la pagina SPA
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API verso il backend (stesso host, porta interna compose)
    location /v1/ {
        proxy_pass http://backend:8090/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming: disabilita buffering e allunga i timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
