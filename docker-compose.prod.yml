# Docker Compose produzione homelab-agent (CT 125)
# Backend FastAPI + Frontend statico servito da nginx (con proxy /v1 verso il backend).
# La API_SECRET_KEY condivisa è letta dal file .env nella root del progetto.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: agent-backend
    ports:
      - "8090:8090"
    env_file:
      - ./backend/.env
    environment:
      CHECKPOINT_DB_PATH: /data/checkpoints.db
    volumes:
      - agent_data:/data
      - ./backend:/app:ro
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Suite di test sul codice corrente, isolata dai dati di produzione (nessun volume agent_data).
  # Uso: docker compose -f docker-compose.prod.yml run --rm backend-test [args pytest]
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    volumes:
      - ./backend:/app:ro
    tmpfs:
      - /data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /v1
    container_name: agent-frontend
    ports:
      - "80:80"
    environment:
      # Iniettata a runtime dall'entrypoint per generare /config.json
      API_SECRET_KEY: ${API_SECRET_KEY}
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  agent_data:
