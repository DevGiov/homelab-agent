name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Stesso stage `test` del Dockerfile usato da `make test-container` su CT 125:
      # Python 3.12, dipendenze dev e modello di embedding inclusi nell'immagine
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: test
          tags: homelab-agent-backend-test
          load: true
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Lint (ruff)
        run: >
          docker run --rm -v "$PWD/backend:/app:ro" --entrypoint ruff
          homelab-agent-backend-test check --no-cache --output-format=github .

      - name: Test (pytest)
        run: docker run --rm -v "$PWD/backend:/app:ro" --tmpfs /data homelab-agent-backend-test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
